<meta name="robots" content="noindex">
<title>Reset password – LeonjAI</title>
<link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/pages.css">
</head>
<body data-app="../">
<header><div class="bar">
<a class="logo" href="../../"><i>L</i><span>LeonjAI<small>デザインスタジオ</small></span></a>
<nav><a href="../../#work">Work</a><a href="../../#services">Services</a><a href="../../#gallery">Gallery</a><a href="../../#pricing">Pricing</a><a href="../../#quote">Contact</a></nav>
<button class="btn out" id="acct">Profile</button>
<button class="sw" id="theme" aria-label="Toggle dark mode"><span>Dark mode</span><b></b></button>
<button class="menu" id="menu" aria-label="Open menu" aria-expanded="false"><span></span><span></span><span></span></button>
</div></header>
<main class="auth"><div class="card">
<h1>Reset password</h1>
<form id="req" novalidate>
<p class="lead">Enter your email and we will send you a reset link.</p>
<div class="field"><label for="em">Email</label><input id="em" type="email" autocomplete="email"></div>
<div class="msg" id="msg" role="alert"></div>
<button class="btn">Send reset link</button>
</form>
<form id="setp" novalidate hidden>
<p class="lead">Choose a new password.</p>
<div class="field"><label for="np">New password</label><div class="pw"><input id="np" type="password" autocomplete="new-password"><button type="button" class="eye" data-showpass="np" aria-label="Show password">Show</button></div></div>
<div class="msg" id="msg2" role="alert"></div>
<button class="btn">Save password</button>
</form>
<div class="links"><a href="../login/">Back to sign in</a></div>
</div></main>
