<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>if (/\/index\.html$/i.test(location.pathname)) location.replace(location.pathname.replace(/index\.html$/i, '') + location.search + location.hash);</script>
<meta name="robots" content="noindex">
<title>Sign in – LeonjAI</title>
<link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/pages.css">
</head>
<body data-app="../">
<header><div class="bar">
<a class="logo" href="../../"><i>L</i><span>LeonjAI<small>デザインスタジオ</small></span></a>
<nav><a href="../../">Home</a><a href="../../#models">Business models</a><a href="../../#how">How it works</a></nav>
<button class="btn out" id="acct">Profile</button>
<button class="sw" id="theme" aria-label="Toggle dark mode"><span>Dark mode</span><b></b></button>
<button class="menu" id="menu" aria-label="Open menu" aria-expanded="false"><span></span><span></span><span></span></button>
</div></header>
<main class="auth"><div class="card">
<h1>Sign in</h1>
<p class="lead">Sign in to manage your LeonjAI account.</p>
<div class="tabs" role="group" aria-label="Sign in or create account"><button type="button" id="t-in" class="on">Sign in</button><button type="button" id="t-up">Create account</button></div>
<form id="lf" novalidate>
<div id="up-fields" hidden>
<div class="field"><label for="nm">Full name</label><input id="nm" autocomplete="name"></div>
<div class="field"><label for="ad">Address</label><input id="ad" autocomplete="street-address"></div>
<div class="field"><label for="bd">Birthday</label><input id="bd" type="date" autocomplete="bday"></div>
<div class="field"><label for="ph">Contact number</label><input id="ph" type="tel" autocomplete="tel" placeholder="+63 900 000 0000"></div>
</div>
<div class="field"><label for="em">Email</label><input id="em" type="email" autocomplete="email"></div>
<div class="field"><label for="pw">Password</label><div class="pw"><input id="pw" type="password" autocomplete="current-password"><button type="button" class="eye" data-showpass="pw" aria-label="Show password">Show</button></div></div>
<div class="msg" id="msg" role="alert"></div>
<button class="btn" id="go">Sign in</button>
</form>
<div class="links"><a href="../reset/">Forgot password?</a><a href="../../">Back to site</a></div>
</div></main>
<footer>© 2026 LeonjAI Design Studio</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>

<script src="../assets/js/theme.js"></script>
<script src="../assets/js/petals.js"></script>
<script src="../assets/js/cart.js"></script>
<script src="../assets/js/showpass.js"></script>
<script src="../assets/js/login.js"></script>
<script src="../assets/js/nav-auth.js"></script>
<script src="../assets/js/menu.js"></script>
</body>
</html>
