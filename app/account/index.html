<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Profile – LeonjAI</title>
<link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/pages.css">
</head>
<body data-app="../">
<header><div class="bar">
<a class="logo" href="../../index.html"><i>L</i><span>LeonjAI<small>デザインスタジオ</small></span></a>
<nav><a href="../../index.html#work">Work</a><a href="../../index.html#services">Services</a><a href="../../index.html#gallery">Gallery</a><a href="../../index.html#pricing">Pricing</a><a href="../../index.html#quote">Contact</a></nav>
<button class="btn out" id="acct">Profile</button>
<button class="sw" id="theme" aria-label="Toggle dark mode"><span>Dark mode</span><b></b></button>
<button class="menu" id="menu" aria-label="Open menu" aria-expanded="false"><span></span><span></span><span></span></button>
</div></header>
<main class="auth center"><div class="card profile">
<p class="lead" id="nocfg" hidden>Profiles are not set up yet. Add your Supabase URL and anon key to app/assets/js/config.js.</p>
<div id="acc" hidden>
<div class="pf-banner"></div>
<div class="avatar">
<div class="av" id="av">?</div>
<button class="cam" id="cam" type="button" aria-label="Change photo"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
<input type="file" id="file" accept="image/*" hidden>
</div>
<h1 class="pf-name" id="pname"></h1>
<p class="pf-mail" id="email"></p>
<div class="msg" id="msg" role="alert"></div>
<div class="menu-list">
<div class="row-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg><span>Dark mode</span><button type="button" id="dm" class="tgl" role="switch" aria-checked="false" aria-label="Dark mode"><i></i></button></div>

<button class="row-btn" data-panel="p-details" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg><span>Profile details</span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
<div class="panel2" id="p-details" hidden>
<form id="pf" novalidate>
<div class="field"><label for="nm">Full name</label><input id="nm" autocomplete="name"></div>
<div class="field"><label for="ad">Address</label><input id="ad" autocomplete="street-address"></div>
<div class="field"><label for="bd">Birthday</label><input id="bd" type="date" autocomplete="bday"></div>
<div class="field"><label for="ph">Contact number</label><input id="ph" type="tel" autocomplete="tel" placeholder="+63 900 000 0000"></div>
<div class="field"><label for="em">Email</label><input id="em" type="email" autocomplete="email"></div>
<div class="msg" id="dmsg" role="alert"></div>
<button class="btn">Save details</button>
</form>
</div>

<button class="row-btn" data-panel="p-orders" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 8h14l-1 12H6L5 8z"/><path d="M9 8a3 3 0 0 1 6 0"/></svg><span>Orders</span><span class="count" id="ocount">0</span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
<div class="panel2" id="p-orders" hidden>
<p class="lead" id="osum" hidden></p>
<ul class="list" id="orders"></ul>
<a class="btn" id="addorder" href="../../index.html#pricing">Add order</a>
<button class="btn gold" id="checkout" type="button" disabled>Check out</button>
</div>

<button class="row-btn" data-panel="p-list" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12"/><path d="M4 6h.01M4 12h.01M4 18h.01"/></svg><span>Order list</span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
<div class="panel2" id="p-list" hidden>
<ul class="list" id="pending"></ul>
<button class="btn" id="place" type="button" hidden>Place order, pay later</button>
</div>

<button class="row-btn" data-panel="p-settings" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg><span>Settings</span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
<div class="panel2" id="p-settings" hidden>
<a class="btn out" href="../reset/index.html">Change password</a>
<button class="btn out" id="del" type="button">Delete account</button>
</div>

<button class="row-btn" id="so" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M10 4H5v16h5"/><path d="M15 8l4 4-4 4M19 12H9"/></svg><span>Log out</span></button>
</div>
</div>
</div></main>
<footer>© 2026 LeonjAI Design Studio</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/theme.js"></script>
<script src="../assets/js/petals.js"></script>
<script src="../assets/js/cart.js"></script>
<script src="../assets/js/account.js"></script>
<script src="../assets/js/nav-auth.js"></script>
<script src="../assets/js/menu.js"></script>
</body>
</html>
